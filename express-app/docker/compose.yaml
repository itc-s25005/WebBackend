name: express-app

services:
  db:
    image: postgres:18-alpine
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: foobarhogepiyo
    volumes:
      - type: volume
        source: db-data
        target: /var/lib/postgresql
      - type: bind
        source: ./initdb.d
        target: /docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

volumes:
  db-data: